<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeWhy</title>
<style>
  :root { --bg:#ffffff; --text:#1a1a1a; --muted:#666; --card:#f5f6f8; --line:#d9dce1; --accent:#2457d6;
          --verified:#1e7a3c; --inferred:#9a6200; --unknown:#666; --heuristic:#6b3fa0; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --text:#e8e8e8; --muted:#9aa0a6; --card:#1e2127; --line:#343942; --accent:#6c93ff;
            --verified:#5ac47c; --inferred:#e0a93b; --unknown:#9aa0a6; --heuristic:#b794f4; --warn:#f28b82; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, Arial, sans-serif; line-height:1.5; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  h1 { margin:0 0 8px; font-size:26px; }
  h2 { font-size:16px; margin:24px 0 8px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .banner { background:#fff3cd; color:#5c4400; border:1px solid #e6cf7a; padding:8px 12px; border-radius:8px; font-size:14px; margin-bottom:16px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; font:inherit; padding:9px 12px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); color:var(--text); }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .nav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
  .stat .num { font-size:28px; font-weight:700; }
  .stat .name { font-weight:600; }
  .item { display:block; width:100%; text-align:left; margin-bottom:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; border:1.5px solid currentColor; margin-right:8px; }
  .verified { color:var(--verified); }
  .inferred { color:var(--inferred); border-style:dashed; }
  .unknown { color:var(--unknown); border-style:dotted; }
  .heuristic { color:var(--heuristic); border-style:double; }
  .plain { color:var(--text); border-style:solid; border-color:var(--line); }
  .refs a { font-size:13px; margin-left:4px; }
  .muted { color:var(--muted); font-size:14px; }
  .abstain { border:2px solid var(--warn); color:var(--warn); font-weight:600; font-size:18px; }
  .drift { border:2px solid var(--heuristic); }
  .drift .title { font-size:18px; font-weight:700; color:var(--heuristic); margin-bottom:6px; }
  .tl { border-left:3px solid var(--line); margin-left:6px; padding-left:14px; }
  .tl .when { font-weight:600; }
  a { color:inherit; }
  ul { padding-left:0; list-style:none; margin:0; }
</style>
</head>
<body>
<main>
  <h1>CodeWhy</h1>
  <div id="banner"></div>

  <h2>Repository</h2>
  <div class="row">
    <input id="repo-input" type="text" placeholder="https://github.com/owner/repo" aria-label="GitHub repository URL">
    <button id="analyze" class="primary">Analyze</button>
  </div>
  <div id="repo-msg"></div>

  <div id="overview"></div>
  <div id="items"></div>
  <div id="nav" class="nav"></div>
  <div id="app"></div>
</main>

<script>
const API_BASE = 'http://localhost:8000';
const MODES = [
  { key: 'why',          label: 'Why is it like this?' },
  { key: 'history',      label: 'How did it change?' },
  { key: 'still_needed', label: 'Is it still needed?' },
  { key: 'dna',          label: 'Code DNA' },
];
const EVENT_NAMES = {
  original_change: 'Original change', discussion: 'Discussion', later_change: 'Later change',
  revert: 'Revert', supersession: 'Superseded',
};
const STATS = [
  ['explained', 'Explained', 'have evidence saying why they exist'],
  ['unknown', 'Unknown', 'no evidence found'],
  ['unchanged_since_decision', 'Unchanged', 'not touched since the decision'],
  ['changed_since_decision', 'Changed', 'later commits touched them'],
  ['superseded', 'Superseded', 'a later decision replaced them'],
  ['possibly_outdated', 'Possibly outdated', 'flagged by the heuristic drift check'],
];

const app = document.getElementById('app');
const nav = document.getElementById('nav');
const banner = document.getElementById('banner');
const repoMsg = document.getElementById('repo-msg');
const overviewBox = document.getElementById('overview');
const itemsBox = document.getElementById('items');
let REPOS = [];
let state = { repo: null, item: null, mode: 'why' };

// ---------- small helpers ----------
function el(tag, cls, text) {              // safe: text is never treated as HTML
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function heading(box, title) { box.appendChild(el('h2', null, title)); }
function section(title) { heading(app, title); }
function safeUrl(u) { return typeof u === 'string' && /^https?:\/\//.test(u) ? u : null; }
function badge(label) {
  const l = ['verified', 'inferred', 'unknown', 'heuristic'].includes(label) ? label : 'unknown';
  return el('span', 'badge ' + l, l);
}
function refs(ids, byId) {                 // [ev1] [ev2] links
  const s = el('span', 'refs');
  (ids || []).forEach(id => {
    const ev = byId[id];
    const url = ev && safeUrl(ev.url);
    if (url) {
      const a = el('a', null, '[' + id + ']');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      s.appendChild(a);
    } else {
      s.appendChild(el('span', 'muted', ' [' + id + ']'));
    }
  });
  return s;
}
// Accepts "https://github.com/owner/repo", "github.com/owner/repo/", "owner/repo", with or without .git
function parseRepo(text) {
  const m = String(text).trim().replace(/\.git$/, '').replace(/\/+$/, '')
    .match(/^(?:https?:\/\/)?(?:www\.)?(?:github\.com\/)?([\w.-]+)\/([\w.-]+)$/i);
  return m ? m[1] + '/' + m[2] : null;
}

// ---------- API access (the only place that talks to the backend) ----------
async function api(path, options) {
  const res = await fetch(API_BASE + path, options);
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status);
    err.status = res.status;
    try { err.body = await res.json(); } catch (e) {}
    throw err;
  }
  return res.json();
}

async function loadRepos() {
  const d = await api('/repos');
  return Array.isArray(d) ? d : (d.repos || []);
}

// the ONE place that gets answers
async function getAnswer(repo, item, mode) {
  return api('/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ repo: repo, item_id: item.id, mode: mode })
  });
}

// ---------- reusable result sections ----------
function showAnswer(r, byId) {
  if (!r.answer || (Array.isArray(r.answer) && !r.answer.length)) return;
  section('Answer');
  const answers = Array.isArray(r.answer) ? r.answer : [{ text: r.answer, label: 'unknown', evidence_ids: [] }];
  answers.forEach(a => {
    const card = el('div', 'card');
    card.appendChild(badge(a.label));
    card.appendChild(el('span', null, a.text));
    card.appendChild(refs(a.evidence_ids, byId));
    app.appendChild(card);
  });
}
function showConfidence(r) {               // level only; the backend computes the basis
  if (!r.confidence) return;
  section('Confidence');
  app.appendChild(el('div', 'card', 'Level: ' + r.confidence.level));
}
function showDecision(r) {
  if (!r.decision) return;
  section('Decision');
  let t = r.decision.summary + ' (' + r.decision.date + ', status: ' + r.decision.status + ')';
  if (r.decision.superseded_by) t += '. Superseded by: ' + (r.decision.superseded_by.summary || '');
  app.appendChild(el('div', 'card', t));
}
function showWho(r) {
  const who = r.who_to_ask || r.person_to_ask;
  if (!who) return;
  section('Who to ask');
  let t = who.login + (who.reason ? ': ' + who.reason : '');
  t += who.still_active === false ? ' (not active recently)' : who.still_active ? ' (active)' : '';
  app.appendChild(el('div', 'card', t));
}
function showSources(r) {
  if (!(r.evidence || []).length) return;
  section('Sources');
  const ul = el('ul');
  r.evidence.forEach(ev => {
    const li = el('li', 'card');
    li.appendChild(badge(ev.evidence_type));
    const url = safeUrl(ev.url);
    if (url) {
      const a = el('a', null, '[' + ev.id + '] ' + ev.title);
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      li.appendChild(a);
    } else {
      li.appendChild(el('span', null, '[' + ev.id + '] ' + ev.title));
    }
    li.appendChild(el('div', 'muted', ev.type + ' · ' + ev.date + (ev.author ? ' · ' + ev.author : '')));
    ul.appendChild(li);
  });
  app.appendChild(ul);
}
function showConnected(r) {
  if (!(r.connected_items || []).length) return;
  section('Connected items');
  const ul = el('ul');
  r.connected_items.forEach(c => {
    const li = el('li', 'card');
    li.appendChild(badge(c.evidence_type));
    li.appendChild(el('span', null, c.label + ' (' + c.edge_type + ')'));
    ul.appendChild(li);
  });
  app.appendChild(ul);
  app.appendChild(el('p', 'muted', r.connected_note || 'Based on repo history only, not a prediction.'));
}
function showLimitations(r) {
  if (!(r.limitations || []).length) return;
  section('Limitations');
  app.appendChild(el('p', 'muted', r.limitations.join(' · ')));
}
function showTimeline(r, byId) {
  if (!(r.timeline || []).length) return;
  section('Timeline');
  const wrap = el('div', 'tl');
  r.timeline.forEach(t => {
    const card = el('div', 'card');
    const head = el('div');
    head.appendChild(badge(t.evidence_type));
    head.appendChild(el('span', 'when', t.date + ' · ' + (EVENT_NAMES[t.event] || t.event)));
    card.appendChild(head);
    const body = el('div', null, t.text);
    body.appendChild(refs(t.evidence_ids, byId));
    card.appendChild(body);
    wrap.appendChild(card);
  });
  app.appendChild(wrap);
}
function showDrift(r, byId) {
  section('Drift check');
  const d = r.drift_alert;
  if (!d) { app.appendChild(el('div', 'card', 'No drift flagged for this item.')); return; }
  const card = el('div', 'card drift');
  card.appendChild(el('div', 'title', d.label || 'Possibly outdated. Verify.'));
  card.appendChild(badge('heuristic'));
  card.appendChild(el('span', 'muted', 'Heuristic, not a verified fact'));
  const orig = el('div'); orig.appendChild(el('strong', null, 'Original reason: ')); orig.appendChild(refs(d.original_reason_evidence, byId));
  const later = el('div'); later.appendChild(el('strong', null, 'Later change: ')); later.appendChild(refs(d.later_change_evidence, byId));
  card.appendChild(orig); card.appendChild(later);
  if (d.workaround_still_in_code) {
    const w = d.workaround_still_in_code;
    card.appendChild(el('div', null, 'Workaround still in code: ' + (w.checked ? 'checked. ' : 'not checked. ') + (w.path || '') + ' ' + (w.note || '')));
  }
  if ((d.needs_human_verification || []).length) {
    card.appendChild(el('div', null, 'A human still needs to check:'));
    const ul = el('ul');
    d.needs_human_verification.forEach(x => ul.appendChild(el('li', 'muted', '• ' + x)));
    card.appendChild(ul);
  }
  app.appendChild(card);
}
function showDna(r, byId) {
  if (!r.dna) return;
  section('Origin');
  const o = el('div', 'card', r.dna.origin.text);
  o.appendChild(refs(r.dna.origin.evidence_ids, byId));
  app.appendChild(o);
  if ((r.dna.key_decisions || []).length) {
    section('Key decisions');
    r.dna.key_decisions.forEach(k => {
      const c = el('div', 'card', k.date + ': ' + k.summary);
      c.appendChild(refs(k.evidence_ids, byId));
      app.appendChild(c);
    });
  }
  if ((r.dna.changed_together || []).length) {
    section('Files changed together');
    r.dna.changed_together.forEach(f => {
      const c = el('div', 'card');
      c.appendChild(badge(f.evidence_type));
      c.appendChild(el('span', null, f.path + ' (' + f.times + ' times)'));
      app.appendChild(c);
    });
  }
}

// ---------- page parts ----------
function showOverview(ov, repoName) {
  overviewBox.textContent = '';
  heading(overviewBox, 'Overview: ' + (ov.repo || repoName));
  const g = ov.ingested || {};
  overviewBox.appendChild(el('p', 'muted',
    'Based on ' + g.commits + ' commits, ' + g.pulls + ' pull requests and ' + g.issues + ' issues' +
    (g.fetched_at ? ' (fetched ' + g.fetched_at + ')' : '') + '. ' + (g.note || '')));
  const grid = el('div', 'stats');
  const counts = ov.counts || {};
  STATS.forEach(([key, name, desc]) => {
    const c = el('div', 'card stat');
    c.appendChild(el('div', 'num', String(counts[key] !== undefined ? counts[key] : '-')));
    c.appendChild(el('div', 'name', name));
    c.appendChild(el('div', 'muted', desc));
    grid.appendChild(c);
  });
  overviewBox.appendChild(grid);
  overviewBox.appendChild(el('p', 'muted', '"Possibly outdated" can overlap the other groups. Counts cover only the fetched slice of history.'));
}

function showItems(items) {
  itemsBox.textContent = '';
  heading(itemsBox, 'Pick a file or decision');
  items.forEach(it => {
    const b = el('button', 'item');
    b.setAttribute('aria-pressed', state.item && state.item.id === it.id ? 'true' : 'false');
    b.appendChild(el('span', 'badge plain', it.state));
    b.appendChild(el('span', null, it.label));
    b.appendChild(el('span', 'muted', '  ' + it.evidence_count + ' evidence'));
    b.addEventListener('click', () => { state.item = it; state.mode = 'why'; showItems(items); renderResult(); });
    itemsBox.appendChild(b);
  });
}

function buildNav() {
  nav.textContent = '';
  if (!state.item) return;
  MODES.forEach(m => {
    const b = el('button', null, m.label);
    b.setAttribute('aria-pressed', m.key === state.mode ? 'true' : 'false');
    b.addEventListener('click', () => { state.mode = m.key; renderResult(); });
    nav.appendChild(b);
  });
}

async function renderResult() {
  buildNav();
  app.textContent = '';
  if (!state.item) return;
  let r = null;
  try { r = await getAnswer(state.repo, state.item, state.mode); }
  catch (err) { app.appendChild(el('div', 'card abstain', 'Could not get an answer. ' + err.message)); return; }
  if (!r) {
    app.appendChild(el('div', 'card', 'No answer returned for this item.'));
    return;
  }
  app.appendChild(el('p', 'muted', 'Item: ' + (r.item ? r.item.label : state.item.label)));
  if (r.status === 'insufficient_evidence') {          // exact message required by the schema
    app.appendChild(el('div', 'card abstain', r.message || 'Insufficient evidence in the repository.'));
    return;
  }
  const byId = {};
  (r.evidence || []).forEach(e => { byId[e.id] = e; });
  const key = state.mode;
  if (key === 'history') {
    showTimeline(r, byId); showDecision(r); showConfidence(r); showSources(r);
  } else if (key === 'still_needed') {
    showDrift(r, byId); showAnswer(r, byId); showConfidence(r); showDecision(r); showSources(r);
  } else if (key === 'dna') {
    showDna(r, byId); showConnected(r); showSources(r);
  } else {
    showAnswer(r, byId); showConfidence(r); showDecision(r); showWho(r); showSources(r); showConnected(r);
  }
  showLimitations(r);
}

function clearBelowRepo() {
  overviewBox.textContent = ''; itemsBox.textContent = ''; nav.textContent = ''; app.textContent = '';
  state = { repo: null, item: null, mode: 'why' };
  banner.className = ''; banner.textContent = '';
}

async function analyze() {
  clearBelowRepo();
  repoMsg.textContent = '';
  const repo = parseRepo(document.getElementById('repo-input').value);
  if (!repo) {
    repoMsg.appendChild(el('div', 'card abstain', 'Please paste a GitHub URL like https://github.com/owner/repo'));
    return;
  }
  try {
    const ov = await api('/repos/' + repo + '/overview');
    const it = await api('/repos/' + repo + '/items');
    state.repo = repo;
        const meta = REPOS.find(r => r.repo.toLowerCase() === repo.toLowerCase());
    if (meta && meta.synthetic) {
      banner.className = 'banner';
      banner.textContent = 'Synthetic sample data. Not a real repository.';
    } else {
      banner.className = '';
      banner.textContent = '';
    }
    showOverview(ov, repo);
    showItems(Array.isArray(it) ? it : (it.items || []));
  } catch (err) {
    if (err.status === 404) {
      repoMsg.appendChild(el('div', 'card abstain', 'Not cached: ' + repo));
      repoMsg.appendChild(el('p', 'muted', 'The demo works only with repositories that were fetched in advance. Try: ' +
        REPOS.filter(r => r.cached).map(r => r.repo).join(', ')));
    } else {
      repoMsg.appendChild(el('div', 'card abstain', 'Could not load this repository. ' + err.message));
    }
  }
}

async function load() {
  document.getElementById('analyze').addEventListener('click', analyze);
  document.getElementById('repo-input').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
  try {
    REPOS = await loadRepos();
   
  } catch (err) {
    app.textContent = 'Could not reach the API at ' + API_BASE + '. Is uvicorn running? (' + err.message + ')';
  }
}
load();
</script>
</body>
</html>
